services:
  - type: web
    name: soembark-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        value: https://soembark.vercel.app
      - key: ADMIN_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_TO
        sync: false
      - key: NOTIFY_FROM
        sync: false
      - key: NODE_ENV
        value: production
